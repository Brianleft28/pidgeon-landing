services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        - NODE_ENV=production
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    networks:
      - pidgeon-net
    depends_on:
      - mysql

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://backend:3000
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - pidgeon-net

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=brian5451
      - MYSQL_DATABASE=pidgeon_db
      - MYSQL_USER=pidgeon
      - MYSQL_PASSWORD=pidgeon
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - pidgeon-net

networks:
  pidgeon-net:
    driver: bridge

volumes:
  mysql-data:
    driver: local
