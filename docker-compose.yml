services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        - NODE_ENV=production
    ports:
      - "4001:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash-lite}
      - GEMINI_MODEL_FALLBACK=${GEMINI_MODEL_FALLBACK:-gemini-3.1-flash-lite,gemini-3.5-flash-lite,gemini-2.5-flash}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - SMTP_TO=${SMTP_TO:-}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-brianleft}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - ADMIN_SHADOW_WORD=${ADMIN_SHADOW_WORD:-/shadow}
      - ADMIN_TOKEN_SECRET=${ADMIN_TOKEN_SECRET:-pidgeon-default-secret}
      - SQLITE_DB_PATH=${SQLITE_DB_PATH:-/app/data/pidgeon.sqlite}
    volumes:
      - pidgeon-data:/app/data
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - pidgeon-net

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=https://pidgeonsolutions.tech/api
    ports:
      - "3002:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - pidgeon-net

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped
    networks:
      - pidgeon-net

volumes:
  pidgeon-data:

networks:
  pidgeon-net:
    driver: bridge
